    <!-- js -->

    <script>
        useTransparentGNB = true;

        $(document).ready(function () {
            $('.gform').on('submit', function (event) {
                event.preventDefault();
                sendForm(this);
            });

            if (isMobile) {
                $(".rect-button").removeClass("dark");
            }
        });

        //*************** 스크롤 ***************//
        window.addEventListener("scroll", function (e) {
            if (window.scrollY > 70) {
                $("#header").addClass("solid");
            } else {
                $("#header").removeClass("solid");
            }
        });

        function sendForm(form){
            var obj = new Object();
            var content = '';

            obj.name = $('#name').val().trim();
            obj.phone = $('#phone').val().trim();
            obj.company = $('#company').val().trim();
            obj.email = $('#email').val().trim();
            obj.category = $('#category').val();
            obj.title = $('#title').val().trim();
            obj.content = $('#content').val();

            // 이름
            if(obj.name == ''){
                alert('이름을 입력해주세요.');
                $('#name').focus();
                return;
            }

            // 이메일
            if(obj.phone=='' && obj.email == ''){
                alert('연락처나 이메일을 입력해주세요.');
                if(obj.phone === ''){
                    $('#phone').focus();
                } else if(obj.email == ''){
                    $('#email').focus();
                }
                return;
            }

            // 문의 구분
            if(!obj.category){
                alert('문의 구분을 선택해주세요.');
                $('#category').focus();
                return;
            }

            // 제목
            if(obj.title == ''){
                alert('제목을 입력해주세요.');
                $('#title').focus();
                return;
            }

            // 내용
            if(obj.content == ''){
                alert('내용을 입력해주세요.');
                $('#content').focus();
                return;
            }

            // 개인정보 수집 동의 체크 확인
            if ($('#chk-personal').prop('checked') == false) {
                alert('개인정보 수집 및 이용에 동의해주세요.');
                $('#chk-personal').focus();
                return;
            }

            // 폼에 설정된 Google Apps Script 엔드포인트로 기본 전송합니다.
            // 기존 sendMail.php는 프로젝트에 없어 전송이 중단되고 있었습니다.
            form.submit();
        }
    </script>
